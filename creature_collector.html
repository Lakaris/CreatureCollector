<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creature Collector</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#f5f5f5}
.app{width:100%;height:100dvh;display:flex;flex-direction:column;overflow:hidden;padding:0}
.app-content{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 16px;min-height:0}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
.nav{display:flex;gap:4px;background:#e8e8e8;border-radius:12px;padding:4px;margin:0 16px 14px;flex-shrink:0}
.nav-btn{flex:1;padding:7px 4px;border:none;background:transparent;border-radius:8px;font-size:10px;font-weight:500;cursor:pointer;color:#666;transition:all .15s}
.nav-btn.active{background:#fff;color:#000}
.nav-btn i{display:block;font-size:17px;margin-bottom:2px}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.screen-title{font-size:16px;font-weight:500;color:#000}
.currency-row{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:4px;background:#e8e8e8;border-radius:20px;padding:3px 9px;font-size:12px;font-weight:500;color:#000}
.card{background:#fff;border:0.5px solid rgba(0,0,0,0.1);border-radius:12px;padding:12px}
.badge{display:inline-block;font-size:10px;font-weight:500;padding:2px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:.04em}
.badge-common{background:#D3D1C7;color:#2C2C2A}
.badge-rare{background:#B5D4F4;color:#042C53}
.badge-epic{background:#CECBF6;color:#26215C}
.badge-legendary{background:#FAC775;color:#412402}
.stat-row{display:flex;flex-direction:column;align-items:center;flex:1;padding:6px 4px;background:#f5f5f5;border-radius:6px}
.stat-label{font-size:9px;color:#888;font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
.stat-val{font-size:13px;color:#222;font-weight:700;line-height:1}
.btn{display:block;width:100%;padding:10px;border:0.5px solid rgba(0,0,0,0.2);border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;background:transparent;color:#000;transition:all .15s;text-align:center;margin-bottom:8px}
.btn:hover{background:#f0f0f0}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{background:#534AB7;color:#fff;border-color:#534AB7}
.btn-primary:hover{background:#3C3489;border-color:#3C3489}
.btn-sm{padding:5px 12px;font-size:12px;width:auto;margin-bottom:0}
.back-btn{display:flex;align-items:center;gap:6px;background:none;border:none;cursor:pointer;color:#666;font-size:15px;margin-bottom:12px;padding:8px 12px 8px 4px;margin-left:-4px}
.creature-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
.creature-card{background:#fff;border:0.5px solid rgba(0,0,0,0.1);border-radius:10px;padding:8px 6px;cursor:pointer;transition:all .15s;overflow:visible}
.creature-card:hover{border-color:rgba(0,0,0,0.2)}
.creature-emoji{font-size:26px;text-align:center;margin-bottom:3px;line-height:1.2}
.creature-name{font-size:11px;font-weight:500;color:#000;text-align:center;margin-bottom:2px;overflow-wrap:anywhere;line-height:1.35}
.creature-type{font-size:11px;color:#666;text-align:center;margin-bottom:6px}
.filter-row{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.filter-row::-webkit-scrollbar{display:none}
.no-scrollbar{scrollbar-width:none}
.no-scrollbar::-webkit-scrollbar{display:none}
.filter-chip{padding:4px 11px;border:0.5px solid rgba(0,0,0,0.1);border-radius:20px;font-size:11px;cursor:pointer;background:transparent;color:#666;white-space:nowrap;flex-shrink:0}
.filter-chip.active{background:#534AB7;color:#fff;border-color:#534AB7}
.xp-row{background:#fff;border:0.5px solid rgba(0,0,0,0.08);border-radius:10px;padding:8px 12px;margin-bottom:12px}
.ability-card{background:#f5f5f5;border-radius:8px;padding:10px;margin-bottom:8px}
.ability-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;gap:10px}
.ability-name{font-size:13px;font-weight:500;color:#000}
.ability-type-badge{font-size:10px;padding:2px 6px;border-radius:4px}
.ab-basic,.ab-special,.ab-unique{background:#e8e8e8;color:#555}
.ability-desc{font-size:12px;color:#666;line-height:1.5;margin-bottom:6px}
.pip-row{display:flex;gap:4px;align-items:center;margin-bottom:6px}
.pip{width:14px;height:6px;border-radius:3px;background:#ddd}
.pip.filled{background:#7F77DD}
.pip.max{background:#EF9F27}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px}
.modal-box{background:#fff;border-radius:16px;padding:20px;width:100%;text-align:center;max-width:320px}
.modal-emoji{font-size:72px;display:block;margin-bottom:10px}
.gacha-modal-overlay{min-height:400px;background:rgba(0,0,0,0.45);display:flex;align-items:center;justify-content:center;border-radius:12px;padding:16px;margin-bottom:16px}
.hatch-close{background:#534AB7;color:#fff;border:none;border-radius:8px;padding:11px 28px;font-size:14px;font-weight:500;cursor:pointer}
.multi-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;max-height:300px;overflow-y:auto;margin-bottom:14px}
.multi-item{text-align:center;background:#f5f5f5;border-radius:8px;padding:8px}
.multi-item .me{font-size:30px;display:block;margin-bottom:3px}
.multi-item .mn{font-size:11px;font-weight:500;color:#000}
.rates-table{background:#f5f5f5;border-radius:8px;padding:12px;margin-top:12px}
.rates-row{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:0.5px solid rgba(0,0,0,0.08)}
.rates-row:last-child{border-bottom:none}
.gacha-banner{background:#EEEDFE;border-radius:12px;padding:18px;text-align:center;margin-bottom:14px;border:0.5px solid #CECBF6}
.gacha-title{font-size:20px;font-weight:500;color:#26215C;margin-bottom:3px}
.gacha-sub{font-size:12px;color:#534AB7;margin-bottom:14px}
.egg-tap{font-size:60px;display:block;text-align:center;margin-bottom:14px;cursor:pointer;user-select:none;transition:transform .1s}
.egg-tap:active{transform:scale(.88)}
@keyframes revealPop{from{opacity:0;transform:scale(.8) translateY(24px)}to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes fadeIn{from{opacity:0;transform:scale(.88) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes dupeFade{0%{opacity:0;transform:scale(.88)}25%{opacity:1;transform:scale(1)}100%{opacity:0.3;transform:scale(1)}}
@keyframes holdRing{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
@keyframes statLevelUp{0%{background:#e8f5e9;outline-color:#2e7d32;color:#2e7d32}80%{background:#e8f5e9;outline-color:#2e7d32;color:#2e7d32}100%{background:transparent;outline-color:transparent;color:inherit}}
@keyframes atkImpact{0%{opacity:1;transform:translate(-50%,-50%) scale(0.3)}40%{opacity:0.9;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.5)}}
@keyframes pillarFlame{0%{opacity:0.9}60%{opacity:0.75}100%{opacity:0}}
@keyframes shockLine{0%{opacity:0}10%{opacity:1}50%{opacity:0.7}100%{opacity:0}}
@keyframes splashWave{0%{opacity:0;transform:scale(0.4)}12%{opacity:1;transform:scale(1)}70%{opacity:0.7}100%{opacity:0;transform:scale(1.1)}}
@keyframes atkProjectile{0%{opacity:1}80%{opacity:1}100%{opacity:0}}
@keyframes meleeSwing{0%{opacity:0.85;transform:translate(-50%,-50%) scale(0.5)}35%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-50%) scale(0.8)}}
@keyframes bossShockwave{0%{opacity:0.85;transform:translate(-50%,-50%) scale(0.2)}100%{opacity:0;transform:translate(-50%,-50%) scale(4)}}
@keyframes earthEmpSlam{0%{opacity:0.9;transform:translate(-50%,-50%) scale(0.1)}20%{opacity:1}70%{opacity:0.6}100%{opacity:0;transform:translate(-50%,-50%) scale(5)}}
.reveal-screen{position:fixed;inset:0;background:#f5f5f5;z-index:300;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;overflow-y:auto}
.reveal-card{animation:revealPop .3s cubic-bezier(.34,1.56,.64,1);text-align:center}
.reveal-summary{position:fixed;inset:0;background:#f5f5f5;z-index:300;display:flex;flex-direction:column;padding:24px 24px 0}
.reveal-summary-grid{flex:1;overflow-y:auto;padding-bottom:16px}
.reveal-summary-footer{padding:16px 0 24px;background:#f5f5f5}
.section-label{font-size:11px;font-weight:500;color:#666;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
.lv-badge{background:#EAF3DE;color:#173404;font-size:11px;padding:2px 7px;border-radius:12px;font-weight:500}
.asc-stars{color:#EF9F27;font-size:11px;font-weight:600;letter-spacing:1px}
.shard-bar-bg{height:5px;background:#eee;border-radius:3px;overflow:hidden;flex:1}
.shard-bar-fill{height:100%;background:#EF9F27;border-radius:3px;transition:width .3s}
.dev-panel{background:#2C2C2A;border-radius:12px;padding:14px;margin-top:16px}
.dev-title{color:#FAC775;font-size:13px;font-weight:500;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.dev-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.dev-label{color:#B4B2A9;font-size:12px;width:80px;flex-shrink:0}
.dev-input{flex:1;background:#444441;border:0.5px solid #5F5E5A;border-radius:6px;padding:6px 8px;color:#F1EFE8;font-size:12px;outline:none}
.dev-btn{background:#534AB7;color:#fff;border:none;border-radius:6px;padding:6px 12px;font-size:12px;cursor:pointer;white-space:nowrap}
.notify{background:#EAF3DE;color:#173404;border-radius:8px;padding:8px 12px;font-size:13px;margin-bottom:10px;text-align:center}
.skin-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:10px}
.skin-card{background:#f5f5f5;border-radius:8px;padding:8px 4px;text-align:center;cursor:pointer;border:1.5px solid transparent;transition:border-color .15s}
.skin-card.active-skin{background:#EEEDFE;border-color:#534AB7}
.skin-card.locked-skin{opacity:.45;cursor:default}
.skin-emoji{font-size:26px;margin-bottom:3px}
.skin-name{font-size:10px;font-weight:500;color:#000;margin-bottom:3px}
.variant-row{display:flex;gap:4px;justify-content:center;margin-top:6px;flex-wrap:wrap}
.variant-btn{padding:2px 5px;border:1px solid #ddd;border-radius:6px;font-size:16px;cursor:pointer;background:#fff;transition:background .1s;line-height:1.4}
.variant-btn.active-var{background:#EEEDFE;border-color:#534AB7}
.creature-list{scrollbar-width:none;-ms-overflow-style:none;}
.creature-list::-webkit-scrollbar{display:none;}
</style>
</head>

function getRootDef(creatureId){
  let def=CREATURE_MAP[creatureId];
  while(def&&def.evolutionOf)def=CREATURE_MAP[def.evolutionOf];
  return def||CREATURE_MAP[creatureId];
}

function getChain(creatureId){
  let def=CREATURE_MAP[creatureId];
  while(def&&def.evolutionOf)def=CREATURE_MAP[def.evolutionOf];
  if(!def)return[creatureId];
  const chain=[def.id];
  let cur=def;
  while(cur.evolutionId){chain.push(cur.evolutionId);cur=CREATURE_MAP[cur.evolutionId];}
  return chain;
}

function getSkinsForCreature(creatureId){
  const chain=getChain(creatureId);
  return SKIN_SETS.filter(s=>s.chain.some(id=>chain.includes(id)));
}

function rollGacha(banner){
  if(!banner||!banner.rates){
    const roll=Math.random()*100;let cum=0;
    for(const[r,cfg] of Object.entries(RARITY_CONFIG)){
      cum+=cfg.rate;
      if(roll<cum){
        const pool=CREATURES.filter(c=>c.rarity===r&&!c.evolutionOf);
        return pool[Math.floor(Math.random()*pool.length)];
      }
    }
    return CREATURES.find(c=>c.rarity==="common"&&!c.evolutionOf);
  }
  const roll=Math.random()*100;let cum=0;
  for(const entry of banner.rates){
    cum+=entry.rate;
    if(roll<cum){
      if(entry.type==="creature") return CREATURE_MAP[entry.id];
      if(entry.type==="rarity"){
        const pool=CREATURES.filter(c=>c.rarity===entry.rarity&&!c.evolutionOf);
        return pool[Math.floor(Math.random()*pool.length)];
      }
      if(entry.type==="rarity_excl"){
        const pool=CREATURES.filter(c=>c.rarity===entry.rarity&&!c.evolutionOf&&c.id!==entry.exclude);
        if(!pool.length) return CREATURE_MAP[entry.exclude];
        return pool[Math.floor(Math.random()*pool.length)];
      }
    }
  }
  return CREATURES.find(c=>c.rarity==="common"&&!c.evolutionOf);
}

function rollSkinForCreature(creatureId){
  const available=getSkinsForCreature(creatureId);
  if(!available.length)return null;
  const roll=Math.random()*100;
  let cum=0;
  for(const[t,cfg] of Object.entries(SKIN_TIER_CONFIG)){
    cum+=cfg.rate;
    if(roll<cum){
      let pool=available.filter(s=>s.tier===t);
      if(!pool.length)pool=available;
      return pool[Math.floor(Math.random()*pool.length)];
    }
  }
  return null; // failed roll
}

function makeOwnedCreature(def){
  return{id:def.id,level:1,ascensions:0,shards:0,
    abilityLevels:{basic:0,special:0,unique:0},

    activeSkin:null,equipped:[null,null,null,null],equippedTitle:null,equippedAura:null,equippedBackground:null,equippedItem:null,unlockedFlair:[]};
}

function calcStats(def,ownedData){
  const base=def.stats;
  const mult=RARITY_STAT_MULT[def.rarity];
  const asc=ownedData.ascensions;
  const lvl=ownedData.level;
  let s={...base};
  for(let i=0;i<lvl-1;i++){
    const k=STAT_CYCLE[i%5];
    s[k]=(s[k]||0)+Math.round(base[k]*0.05*mult);
  }
  for(const k of STAT_CYCLE)s[k]=Math.round(s[k]*(1+asc*0.08));
  return s;
}

function getDisplayEmoji(def,ownedData,unlockedSkins){
  if(!ownedData||!ownedData.activeSkin)return def.emoji;
  const{setId,variantId}=ownedData.activeSkin;
  if(!unlockedSkins.includes(setId))return def.emoji;
  const skinSet=SKIN_SETS.find(s=>s.id===setId);
  if(!skinSet)return def.emoji;
  const vid=variantId||def.id;
  return(skinSet.appearances[vid]&&skinSet.appearances[vid].emoji)||def.emoji;
}

function AscensionPopup({def,displayEmoji,ascPopup,ownedData,onClose}){
  const statsBefore=calcStats(def,{...ownedData,ascensions:ascPopup-1});
  const statsAfter=calcStats(def,{...ownedData,ascensions:ascPopup});
  const[showNew,setShowNew]=useState(false);
  useEffect(()=>{const t=setTimeout(()=>setShowNew(true),80);return()=>clearTimeout(t);},[]);
  const displayed=showNew?statsAfter:statsBefore;
  return React.createElement("div",{
    onClick:onClose,
    style:{position:"fixed",inset:0,zIndex:600,background:"rgba(0,0,0,0.55)",display:"flex",alignItems:"center",justifyContent:"center"}
  },
    React.createElement("div",{
      onClick:e=>e.stopPropagation(),
      style:{background:"#fff",borderRadius:20,padding:"28px 24px",textAlign:"center",maxWidth:300,width:"90%",boxShadow:"0 8px 32px rgba(0,0,0,0.2)"}
    },
      React.createElement("div",{style:{fontSize:60,marginBottom:6}},displayEmoji),
      React.createElement("div",{style:{fontSize:20,fontWeight:700,marginBottom:4}},def.name),
      React.createElement("div",{style:{fontSize:26,color:"#EF9F27",letterSpacing:3,marginBottom:6}},"★".repeat(ascPopup)),
      React.createElement("div",{style:{fontSize:14,fontWeight:600,color:"#534AB7",marginBottom:16}},"Ascension "+ascPopup+"!"),
      React.createElement("div",{style:{textAlign:"left"}},
        STAT_CYCLE.map(s=>React.createElement("div",{key:s,className:"stat-row"},
          React.createElement("span",{className:"stat-label"},STAT_LABELS[s]),
          React.createElement("div",{className:"stat-bar-bg"},
            React.createElement("div",{className:"stat-bar-fill",style:{width:Math.min(100,Math.round((statsAfter[s]/150)*100))+"%",background:STAT_COLORS[s]}})
          ),
          React.createElement("span",{className:"stat-val"},
            React.createElement("span",{style:{color:"#666"}},statsBefore[s]),
            React.createElement("span",{style:{color:"#aaa",margin:"0 3px"}},"→"),
            React.createElement("span",{style:{color:"#2e7d32",fontWeight:700}},statsAfter[s])
          )
        ))
      ),
      React.createElement("button",{className:"btn btn-primary",style:{width:"100%",marginTop:20,marginBottom:0},onClick:onClose},"Continue")
    )
  );
}

function getBossStats(boss,level){
  const t=(level-1)/9;
  return {
    hp:Math.round(boss.baseStats.hp*(1+1.5*t)),
    atk:Math.round(boss.baseStats.atk*(1+t)),
    def:Math.round(boss.baseStats.def*(1+0.5*t)),
  };
}

      unique:{name:"Rising Fury",description:"Gains increased attack over time"},
    },
    baseStats:{hp:800,atk:100,def:60},
  };
}

// Procedurally generate a large island grid
const ISLAND_COLS=48,ISLAND_ROWS=36,ISLAND_TILE=44;
const TILE_COLORS={W:"#3a9fd4",S:"#e8d59a",G:"#5aaa35"};
const ISLAND_GRID=(()=>{
  const cx=ISLAND_COLS/2-0.5,cy=ISLAND_ROWS/2-0.5;
  const rx=ISLAND_COLS*0.38,ry=ISLAND_ROWS*0.38;
  const grid=[];
  for(let r=0;r<ISLAND_ROWS;r++){
    const row=[];
    for(let c=0;c<ISLAND_COLS;c++){
      const nx=(c-cx)/rx,ny=(r-cy)/ry;
      const d=Math.sqrt(nx*nx+ny*ny);
      if(d>1)row.push("W");
      else if(d>0.82)row.push("S");
      else row.push("G");
    }
    grid.push(row);
  }
  return grid;
})();
const GRASS_CELLS=[];
for(let r=0;r<ISLAND_ROWS;r++)for(let c=0;c<ISLAND_COLS;c++)if(ISLAND_GRID[r][c]==="G")GRASS_CELLS.push({c,r});

const CHUNK_SIZE=3;
const CHUNK_COLS=Math.floor(ISLAND_COLS/CHUNK_SIZE);
const CHUNK_ROWS_COUNT=Math.floor(ISLAND_ROWS/CHUNK_SIZE);
const CHUNK_COST=10;

function chunkKey(cc,cr){return `${cc}_${cr}`;}
function chunkHasLand(cc,cr){
  for(let tr=0;tr<CHUNK_SIZE;tr++)for(let tc=0;tc<CHUNK_SIZE;tc++){
    const r=cr*CHUNK_SIZE+tr,c=cc*CHUNK_SIZE+tc;
    if(ISLAND_GRID[r]&&ISLAND_GRID[r][c]!=="W")return true;
  }
  return false;
}
const INITIAL_CHUNK_KEYS=(()=>{
  const midCr=Math.floor(CHUNK_ROWS_COUNT/2);
  for(let cc=0;cc<CHUNK_COLS;cc++){
    if(chunkHasLand(cc,midCr))return[chunkKey(cc,midCr),chunkKey(cc+1,midCr)];
  }
  return[chunkKey(0,midCr),chunkKey(1,midCr)];
})();

function IslandScreen({owned,unlockedSkins,unlockedChunks,setUnlockedChunks,currencies,setCurrencies}){
  const creatures=Object.values(owned);
  const placements=GRASS_CELLS.slice(0,creatures.length).map((pos,i)=>({...pos,creature:creatures[i]}));
  const containerRef=useRef(null);
  const gestureRef=useRef(null);
  const[view,setView]=useState(()=>{
    const W=window.innerWidth,H=window.innerHeight;
    const scale=Math.min(W/(ISLAND_COLS*ISLAND_TILE),H/(ISLAND_ROWS*ISLAND_TILE),1);
    const gW=ISLAND_COLS*ISLAND_TILE*scale,gH=ISLAND_ROWS*ISLAND_TILE*scale;
    return{x:(W-gW)/2,y:(H-gH)/2,scale};
  });
  const[selectedChunk,setSelectedChunk]=useState(null); // {cc,cr}
  const[notify,setNotify]=useState(null);

  function isUnlocked(cc,cr){return unlockedChunks.has(chunkKey(cc,cr));}
  function isAdjacent(cc,cr){
    return[[0,1],[0,-1],[1,0],[-1,0]].some(([dc,dr])=>unlockedChunks.has(chunkKey(cc+dc,cr+dr)));
  }
  function unlockChunk(cc,cr){
    if((currencies.binoculars||0)<CHUNK_COST){setNotify("Not enough 🔭 Binoculars!");setTimeout(()=>setNotify(null),2000);return;}
    setUnlockedChunks(prev=>new Set([...prev,chunkKey(cc,cr)]));
    setCurrencies(c=>({...c,binoculars:(c.binoculars||0)-CHUNK_COST}));
    setSelectedChunk(null);
  }

  const MIN_SCALE=0.35,MAX_SCALE=2.5;
  function clamp(val,min,max){return Math.min(max,Math.max(min,val));}

  function clampPan(x,y,scale,W,H){
    const gW=ISLAND_COLS*ISLAND_TILE*scale,gH=ISLAND_ROWS*ISLAND_TILE*scale;
    return{
      x:gW<=W?( W-gW)/2:clamp(x,W-gW,0),
      y:gH<=H?(H-gH)/2:clamp(y,H-gH,0),
    };
  }

  function pinchDist(touches){
    const dx=touches[0].clientX-touches[1].clientX,dy=touches[0].clientY-touches[1].clientY;
    return Math.hypot(dx,dy);
  }
  function pinchMid(touches){
    return{x:(touches[0].clientX+touches[1].clientX)/2,y:(touches[0].clientY+touches[1].clientY)/2};
  }

  function onTouchStart(e){
    if(e.touches.length===2){
      gestureRef.current={mode:"pinch",startDist:pinchDist(e.touches),startMid:pinchMid(e.touches),startScale:view.scale,startPan:{x:view.x,y:view.y}};
    } else {
      gestureRef.current={mode:"pan",startX:e.touches[0].clientX,startY:e.touches[0].clientY,startPan:{x:view.x,y:view.y}};
    }
  }
  function onTouchMove(e){
    e.preventDefault();
    if(!gestureRef.current)return;
    const el=containerRef.current;
    const W=el?el.clientWidth:390,H=el?el.clientHeight:600;
    if(gestureRef.current.mode==="pinch"&&e.touches.length===2){
      const{startDist,startMid,startScale,startPan}=gestureRef.current;
      const newDist=pinchDist(e.touches);
      const newScale=clamp(startScale*(newDist/startDist),MIN_SCALE,MAX_SCALE);
      const mid=pinchMid(e.touches);
      const dx=mid.x-startMid.x,dy=mid.y-startMid.y;
      // zoom toward pinch midpoint
      const scaleDelta=newScale/startScale;
      const nx=mid.x+(startPan.x-mid.x)*scaleDelta+dx;
      const ny=mid.y+(startPan.y-mid.y)*scaleDelta+dy;
      const clamped=clampPan(nx,ny,newScale,W,H);
      setView({x:clamped.x,y:clamped.y,scale:newScale});
    } else if(gestureRef.current.mode==="pan"&&e.touches.length===1){
      const{startX,startY,startPan}=gestureRef.current;
      const dx=e.touches[0].clientX-startX,dy=e.touches[0].clientY-startY;
      const clamped=clampPan(startPan.x+dx,startPan.y+dy,view.scale,W,H);
      setView(v=>({...v,...clamped}));
    }
  }
  function onTouchEnd(e){
    if(e.touches.length<2&&gestureRef.current?.mode==="pinch"){
      if(e.touches.length===1){
        gestureRef.current={mode:"pan",startX:e.touches[0].clientX,startY:e.touches[0].clientY,startPan:{x:view.x,y:view.y}};
      } else {
        gestureRef.current=null;
      }
    } else if(e.touches.length===0){
      gestureRef.current=null;
    }
  }

  // Mouse drag
  function onMouseDown(e){
    gestureRef.current={mode:"pan",startX:e.clientX,startY:e.clientY,startPan:{x:view.x,y:view.y}};
  }
  function onMouseMove(e){
    if(!gestureRef.current||gestureRef.current.mode!=="pan")return;
    const el=containerRef.current;
    const W=el?el.clientWidth:390,H=el?el.clientHeight:600;
    const dx=e.clientX-gestureRef.current.startX,dy=e.clientY-gestureRef.current.startY;
    const clamped=clampPan(gestureRef.current.startPan.x+dx,gestureRef.current.startPan.y+dy,view.scale,W,H);
    setView(v=>({...v,...clamped}));
  }
  function onMouseUp(){gestureRef.current=null;}

  // Mouse wheel zoom
  function onWheel(e){
    e.preventDefault();
    const el=containerRef.current;
    const W=el?el.clientWidth:390,H=el?el.clientHeight:600;
    const factor=e.deltaY<0?1.1:0.91;
    const newScale=clamp(view.scale*factor,MIN_SCALE,MAX_SCALE);
    const rect=el.getBoundingClientRect();
    const mx=e.clientX-rect.left,my=e.clientY-rect.top;
    const scaleDelta=newScale/view.scale;
    const nx=mx+(view.x-mx)*scaleDelta;
    const ny=my+(view.y-my)*scaleDelta;
    const clamped=clampPan(nx,ny,newScale,W,H);
    setView({x:clamped.x,y:clamped.y,scale:newScale});
  }

  useEffect(()=>{
    const el=containerRef.current;
    if(!el)return;
    el.addEventListener("wheel",onWheel,{passive:false});
    el.addEventListener("touchmove",onTouchMove,{passive:false});
    return()=>{el.removeEventListener("wheel",onWheel);el.removeEventListener("touchmove",onTouchMove);};
  });

  return React.createElement("div",{
    ref:containerRef,
    onMouseDown,onMouseMove,onMouseUp,onMouseLeave:onMouseUp,
    onTouchStart,onTouchEnd,
    style:{width:"100%",height:"100%",overflow:"hidden",cursor:"grab",background:TILE_COLORS.W,position:"relative",userSelect:"none",touchAction:"none"},
  },
    React.createElement("div",{style:{
      position:"absolute",
      transform:`translate(${view.x}px,${view.y}px) scale(${view.scale})`,
      transformOrigin:"0 0",
      display:"grid",
      gridTemplateColumns:`repeat(${ISLAND_COLS},${ISLAND_TILE}px)`,
      gridTemplateRows:`repeat(${ISLAND_ROWS},${ISLAND_TILE}px)`,
      width:ISLAND_COLS*ISLAND_TILE,
      willChange:"transform",
    }},
      ISLAND_GRID.flatMap((row,r)=>row.map((cell,c)=>{
        const cc=Math.floor(c/CHUNK_SIZE),cr=Math.floor(r/CHUNK_SIZE);
        const unlocked=isUnlocked(cc,cr);
        const placed=unlocked&&placements.find(p=>p.c===c&&p.r===r);
        const def=placed&&CREATURE_MAP[placed.creature.id];
        return React.createElement("div",{
          key:r+","+c,
          style:{
            width:ISLAND_TILE,height:ISLAND_TILE,
            background:unlocked?TILE_COLORS[cell]:cell==="W"?TILE_COLORS.W:"#2a7a2a",
            display:"flex",alignItems:"center",justifyContent:"center",
            fontSize:cell==="G"?26:20,
            boxSizing:"border-box",
            borderRight:cell==="G"?"1px solid rgba(0,0,0,0.05)":"none",
            borderBottom:cell==="G"?"1px solid rgba(0,0,0,0.05)":"none",
          }
        },
          unlocked&&cell==="W"&&React.createElement("span",{style:{opacity:0.2,fontSize:16}},"🌊"),
          def&&React.createElement("span",{style:{filter:"drop-shadow(0 1px 3px rgba(0,0,0,0.3))"}},
            getDisplayEmoji(def,placed.creature,unlockedSkins||[]))
        );
      }))
    ),
    // Chunk lock overlays
    React.createElement("div",{style:{position:"absolute",top:0,left:0,transformOrigin:"0 0",transform:`translate(${view.x}px,${view.y}px) scale(${view.scale})`,pointerEvents:"none",width:ISLAND_COLS*ISLAND_TILE,height:ISLAND_ROWS*ISLAND_TILE}},
      Array.from({length:CHUNK_ROWS_COUNT},(_,cr)=>Array.from({length:CHUNK_COLS},(_,cc)=>{
        if(isUnlocked(cc,cr)||!chunkHasLand(cc,cr))return null;
        const adj=isAdjacent(cc,cr);
        const sel=selectedChunk&&selectedChunk.cc===cc&&selectedChunk.cr===cr;
        return React.createElement("div",{
          key:`ov_${cc}_${cr}`,
          style:{
            position:"absolute",
            left:cc*CHUNK_SIZE*ISLAND_TILE,top:cr*CHUNK_SIZE*ISLAND_TILE,
            width:CHUNK_SIZE*ISLAND_TILE,height:CHUNK_SIZE*ISLAND_TILE,
            background:sel?"rgba(255,200,0,0.25)":adj?"rgba(0,0,0,0.42)":"rgba(0,0,0,0.68)",
            border:sel?"2px solid rgba(255,200,0,0.8)":adj?"2px solid rgba(255,255,255,0.15)":"none",
            boxSizing:"border-box",
            display:"flex",alignItems:"center",justifyContent:"center",
            pointerEvents:"auto",cursor:adj?"pointer":"default",
            fontSize:ISLAND_TILE*0.7,
          },
          onClick:adj?()=>setSelectedChunk(sel?null:{cc,cr}):undefined,
        },
          adj?React.createElement("span",null,"🔒"):null
        );
      }))
    ),
    // Unlock popup
    selectedChunk&&React.createElement("div",{
      style:{position:"absolute",bottom:80,left:"50%",transform:"translateX(-50%)",
        background:"#fff",borderRadius:14,padding:"14px 20px",boxShadow:"0 4px 20px rgba(0,0,0,0.25)",
        textAlign:"center",minWidth:200,zIndex:10},
      onMouseDown:e=>e.stopPropagation(),
      onTouchStart:e=>e.stopPropagation(),
    },
      React.createElement("div",{style:{fontSize:13,fontWeight:600,marginBottom:6}},"Unlock this area?"),
      React.createElement("div",{style:{fontSize:12,color:"#888",marginBottom:12}},"Cost: "+CHUNK_COST+" 🔭 Binoculars"),
      React.createElement("div",{style:{fontSize:12,color:"#555",marginBottom:12}},"You have: "+(currencies.binoculars||0)+" 🔭"),
      React.createElement("div",{style:{display:"flex",gap:8}},
        React.createElement("button",{
          onClick:()=>unlockChunk(selectedChunk.cc,selectedChunk.cr),
          style:{flex:1,padding:"8px 0",background:"#4caf50",color:"#fff",border:"none",borderRadius:8,fontWeight:600,cursor:"pointer",fontSize:13},
        },"Unlock"),
        React.createElement("button",{
          onClick:()=>setSelectedChunk(null),
          style:{flex:1,padding:"8px 0",background:"#eee",color:"#333",border:"none",borderRadius:8,fontWeight:600,cursor:"pointer",fontSize:13},
        },"Cancel")
      )
    ),
    notify&&React.createElement("div",{style:{position:"absolute",top:16,left:"50%",transform:"translateX(-50%)",
      background:"rgba(0,0,0,0.75)",color:"#fff",borderRadius:10,padding:"8px 16px",fontSize:13,fontWeight:600,pointerEvents:"none"
    }},notify),
  );
}

function seededRand(seed){let t=seed+0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;}
const FARM_PLOT_COSTS=[0,100,250,500,1000,2000]; // index = plot number (0-based), cost to unlock that plot
const PLOT_GROW_MS=12*3600000; // 12 hours
const PLOT_CROPS=[
  {key:"food",        label:"Food",            emoji:"🍖", yield:10, upgradeEvery:1},

const FIELD_RATES=[0,2,5,10,18,30]; // food per hour at each level (index=level)
const FIELD_MONEY_RATES=[0,5,12,25,45,80]; // money per hour at each level (index=level)

function FarmScreen({onBack,onPlant,farmPlots,setFarmPlots,currencies,setCurrencies,farmFieldLevel,setFarmFieldLevel,farmFieldLastHarvest,setFarmFieldLastHarvest,farmFieldSeed,setFarmFieldSeed,farmCrops,setFarmCrops,plotUpgrades,setPlotUpgrades,specialPurchased,onGoToStore,setHarvestPopup,setRevealedCount}){

  const [now,setNow]=useState(()=>Date.now());
  useEffect(()=>{const t=setInterval(()=>setNow(Date.now()),10000);return()=>clearInterval(t);},[]);
  function showNotify(msg){setNotify(msg);setTimeout(()=>setNotify(null),2000);}

  const rate=FIELD_RATES[farmFieldLevel]||2;
  const moneyRate=FIELD_MONEY_RATES[farmFieldLevel]||5;
  const shardRate=FIELD_SHARD_RATES[farmFieldLevel]||1;
  const elapsedMs=now-farmFieldLastHarvest;
  const elapsedHours=elapsedMs/3600000;
  const accumulated=Math.floor(Math.min(elapsedHours,FIELD_CAP_HOURS)*rate);
  const accumulatedMoney=Math.floor(Math.min(elapsedHours,FIELD_CAP_HOURS)*moneyRate);
  const accumulatedShards=Math.floor(Math.min(elapsedHours,FIELD_CAP_HOURS)*shardRate);
  const canHarvest=elapsedHours>=FIELD_MIN_HOURS&&accumulated>=1;
  const atCap=elapsedHours>=FIELD_CAP_HOURS;
  const completedHours=Math.floor(Math.min(elapsedHours,FIELD_CAP_HOURS));

  const fieldBonuses=useMemo(()=>{
    const bonuses={};
    for(let h=0;h<completedHours;h++){
      const s=farmFieldSeed+h*999983;
      MELON_TYPES.forEach((m,mi)=>{if(seededRand(s+mi*7919)<0.005)bonuses[m.key]=(bonuses[m.key]||0)+1;});
      if(seededRand(s+500000)<0.005)bonuses.candy=(bonuses.candy||0)+2;
    }
    return bonuses;
  },[completedHours,farmFieldSeed]);

  function harvest(){
    if(!canHarvest)return;
    setCurrencies(c=>{
      const n={...c,food:(c.food||0)+accumulated,money:(c.money||0)+accumulatedMoney,equipShards:(c.equipShards||0)+accumulatedShards};
      Object.entries(fieldBonuses).forEach(([k,v])=>n[k]=(n[k]||0)+v);

        const m=MELON_TYPES.find(m=>m.key===k);
        return {emoji:m?m.emoji:"🍬",label:m?m.label:"Candy",amount:v};

    const h=Math.floor(ms/3600000);

  const maxLevel=FIELD_RATES.length-1;
  const upgradeCost=farmFieldLevel<maxLevel?FIELD_UPGRADE_COSTS[farmFieldLevel]:null;
  const canUpgrade=upgradeCost!==null&&(currencies.money||0)>=upgradeCost;

  function upgrade(){
    if(!canUpgrade)return;
    setCurrencies(c=>({...c,money:c.money-upgradeCost}));
    setFarmFieldLevel(l=>l+1);
    showNotify("Field upgraded to Level "+(farmFieldLevel+1)+"!");
  }

  const nextCost=farmPlots<MAX_MONEY_PLOTS?FARM_PLOT_COSTS[farmPlots]:null;
  const canAfford=(currencies.money||0)>=nextCost;

  function unlockPlot(){
    if(!canAfford)return;

  }

  return React.createElement("div",{style:{position:"fixed",inset:0,background:"#f5f5f5",display:"flex",flexDirection:"column"}},
    React.createElement("div",{style:{padding:"16px 16px 0",display:"flex",alignItems:"center",gap:12,borderBottom:"1px solid #e0e0e0",paddingBottom:12,background:"#fff"}},
      onBack&&React.createElement("button",{onClick:onBack,style:{background:"none",border:"none",cursor:"pointer",fontSize:20,color:"#555",padding:0,lineHeight:1}},
        React.createElement("i",{className:"ti ti-arrow-left"})
      ),
      React.createElement("div",{style:{fontSize:18,fontWeight:700}},"🌾 Farm"),
      React.createElement("div",{style:{marginLeft:"auto",fontSize:13,fontWeight:600,background:"#e8e8e8",borderRadius:20,padding:"4px 12px"}},"💰 "+(currencies.money||0).toLocaleString())
    ),
    React.createElement("div",{style:{display:"flex",background:"#fff",borderBottom:"1px solid #e0e0e0"}},
      [{id:"field",label:"Main Field"},{id:"plots",label:"Plots"}].map(t=>
        React.createElement("button",{key:t.id,onClick:()=>setFarmTab(t.id),style:{
          flex:1,padding:"10px 0",border:"none",background:"none",cursor:"pointer",
          fontSize:13,fontWeight:600,
          color:farmTab===t.id?"#534AB7":"#888",
          borderBottom:farmTab===t.id?"2px solid #534AB7":"2px solid transparent",

// oreType: "normal" | "deluxe" | "rainbow"
function rollTreasure(collected, oreType="normal"){
  const rarityEntries=Object.entries(TREASURE_RARITIES);
  const eligible=oreType==="deluxe"
    ?rarityEntries.filter(([r])=>r!=="common")
    :rarityEntries;
  if(oreType==="rainbow"){
    // Only pull from uncollected; re-weight by rarity rate, skip rarities with no uncollected
    const availByRarity={};
    for(const [r] of eligible){
      const unc=TREASURES.filter(t=>t.rarity===r&&!collected.has(t.id));
      if(unc.length>0) availByRarity[r]=unc;
    }
    const avail=Object.keys(availByRarity);
    if(avail.length===0) return null; // everything collected
    const totalRate=avail.reduce((s,r)=>s+TREASURE_RARITIES[r].rate,0);
    const roll=Math.random()*totalRate;
    let cum=0,rarity=avail[0];
    for(const r of avail){if((cum+=TREASURE_RARITIES[r].rate)>=roll){rarity=r;break;}}
    const pool=availByRarity[rarity];
    return pool[Math.floor(Math.random()*pool.length)];
  }
  // Normal / Deluxe
  const totalRate=eligible.reduce((s,[,cfg])=>s+cfg.rate,0);
  const roll=Math.random()*totalRate;
  let cum=0,rarity=eligible[0][0];
  for(const [r,cfg] of eligible){if((cum+=cfg.rate)>=roll){rarity=r;break;}}
  const pool=TREASURES.filter(t=>t.rarity===rarity);
  const uncollected=pool.filter(t=>!collected.has(t.id));
  return (uncollected.length>0?uncollected:pool)[Math.floor(Math.random()*(uncollected.length||pool.length))];
}

function rollDungeonRewards(count,bossType,bossLevel=10){

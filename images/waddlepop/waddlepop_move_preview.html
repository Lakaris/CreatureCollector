<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Waddlepop walk animation</title>
<style>*{box-sizing:border-box}body{margin:0;padding:28px;background:#efedf3;color:#2d2536;font:16px system-ui;text-align:center}h1{font-size:25px;margin:0 0 8px}.summary{color:#655e6d;margin:0 0 20px}.views{display:flex;align-items:flex-start;justify-content:center;gap:28px;flex-wrap:wrap}.view{background:#faf9fc;border:1px solid #ded9e6;padding:18px;border-radius:18px}h2{font-size:17px;margin:0 0 14px}.stage{background:repeating-conic-gradient(#fff 0 25%,#eae7ef 0 50%) 0/20px 20px;border-radius:10px}.game-stage{width:250px;height:250px;display:grid;place-items:center}.sprite{background-image:url('waddlepop_move.png?v=2c0a91232018');background-size:600% 400%;background-repeat:no-repeat}.game{width:130px;height:130px}.full{width:min(512px,calc(100vw - 94px));aspect-ratio:1}.controls{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin:20px 0 12px}button{padding:9px 16px;border:1px solid #c9c0d4;border-radius:10px;background:#fff;color:#2d2536;font:inherit;cursor:pointer}input{width:min(440px,85vw);accent-color:#695378}.caption{font-size:13px;color:#655e6d}.dark .stage{background:#302c38}a{color:#3c577d}</style>
<h1>Waddlepop · walk animation</h1><p class="summary">Walk in place · gentle bomb bounce · sparking fuse</p>
<div class="views"><section class="view"><h2>Game size · 130 × 130</h2><div class="stage game-stage"><div class="sprite game" role="img" aria-label="Waddlepop walking while carrying its snow bomb"></div></div></section><section class="view"><h2>Full size · 512 × 512</h2><div class="stage"><div class="sprite full" role="img" aria-label="Waddlepop walk animation at full resolution"></div></div></section></div>
<div class="controls"><button id="toggle" type="button">Pause</button><button id="previous" type="button">Previous frame</button><button id="next" type="button">Next frame</button><button id="background" type="button">Dark background</button></div>
<label for="scrub" id="frameLabel">Frame 1</label><div><input id="scrub" type="range" min="0" max="23" value="0" aria-label="Animation frame"></div><p class="caption">24 frames · 1.200 seconds · preview repeats<br>Starts from the base pose and loops without a pause.</p><p><a href="waddlepop_move.png">Spritesheet</a> · <a href="waddlepop_move.json">Timing data</a></p>
<script>
const durations=[50,50,50,50,50,50,50,50,50,50,50,50,50,50,50,50,50,50,50,50,50,50,50,50],columns=6,rows=4,total=1200,starts=[];let sum=0;for(const d of durations){starts.push(sum);sum+=d;}
const sprites=document.querySelectorAll('.sprite'),toggle=document.getElementById('toggle'),scrub=document.getElementById('scrub'),label=document.getElementById('frameLabel');let paused=false,elapsed=0,last=performance.now(),frame=-1;
function paint(n){if(frame===n)return;frame=n;const x=n%columns/(columns-1)*100,y=Math.floor(n/columns)/(rows-1)*100;for(const s of sprites)s.style.backgroundPosition=x+'% '+y+'%';label.textContent='Frame '+(n+1)+' of '+durations.length;scrub.value=n;}
function seek(n){paused=true;toggle.textContent='Play';n=(n+durations.length)%durations.length;elapsed=starts[n];paint(n);}
toggle.addEventListener('click',()=>{paused=!paused;toggle.textContent=paused?'Play':'Pause';});document.getElementById('previous').addEventListener('click',()=>seek(frame-1));document.getElementById('next').addEventListener('click',()=>seek(frame+1));scrub.addEventListener('input',()=>seek(Number(scrub.value)));document.getElementById('background').addEventListener('click',event=>{document.body.classList.toggle('dark');event.target.textContent=document.body.classList.contains('dark')?'Checkerboard background':'Dark background';});
function tick(now){if(!paused){elapsed=(elapsed+now-last)%total;let n=durations.length-1;while(n>0&&elapsed<starts[n])n--;paint(n);}last=now;requestAnimationFrame(tick);}paint(0);requestAnimationFrame(tick);
</script></html>

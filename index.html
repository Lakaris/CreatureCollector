<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Creature Collector</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#534AB7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Creatures">
<link rel="apple-touch-icon" href="images/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="images/icons/favicon-32.png">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/components.css">
<link rel="stylesheet" href="styles/animations.css">
</head>
<body>
<div id="root"></div>
<div id="error-display" style="display:none;position:fixed;inset:0;background:#fff;padding:24px;font-family:monospace;font-size:13px;z-index:99999;overflow:auto;white-space:pre-wrap;color:red"></div>
<script>
window.onerror=function(msg,src,line,col,err){
  var d=document.getElementById('error-display');
  d.style.display='block';
  d.textContent='JS ERROR:\n'+msg+'\n\nFile: '+src+'\nLine: '+line+', Col: '+col+'\n\nStack:\n'+(err&&err.stack||'(no stack)');
};
// ES modules are blocked by CORS on file:// — fail loudly with instructions
// instead of rendering a blank page.
if(location.protocol==='file:'){
  var d=document.getElementById('error-display');
  d.style.display='block';
  d.style.color='#111';
  d.textContent='This app must be served over HTTP, not opened directly from disk.\n\n'
    +'ES modules are blocked by the browser on file:// URLs.\n\n'
    +'Start the dev server, then open http://localhost:3000\n\n'
    +'    powershell -ExecutionPolicy Bypass -File .claude/serve.ps1\n';
}
</script>
<script type="module" src="src/main.js"></script>
</body>
</html>

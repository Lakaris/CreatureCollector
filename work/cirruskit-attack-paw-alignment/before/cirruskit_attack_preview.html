<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cirruskit attack animation</title>
<style>*{box-sizing:border-box}body{margin:0;padding:28px;background:#efedf3;color:#2d2536;font:16px system-ui;text-align:center}h1{font-size:25px;margin:0 0 8px}.summary{color:#655e6d;margin:0 0 20px}.views{display:flex;align-items:flex-start;justify-content:center;gap:28px;flex-wrap:wrap}.view{background:#faf9fc;border:1px solid #ded9e6;padding:18px;border-radius:18px}h2{font-size:17px;margin:0 0 14px}.stage{background:repeating-conic-gradient(#fff 0 25%,#eae7ef 0 50%) 0/20px 20px;border-radius:10px}.game-stage{width:250px;height:250px;display:grid;place-items:center}.sprite{background-image:url('cirruskit_attack.png?v=4331c21e943a');background-size:500% 500%;background-repeat:no-repeat}.game{width:130px;height:130px}.full{width:min(512px,calc(100vw - 94px));aspect-ratio:1}.controls{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin:20px 0 12px}button,select{padding:9px 16px;border:1px solid #c9c0d4;border-radius:10px;background:#fff;color:#2d2536;font:inherit;cursor:pointer}input{width:min(440px,85vw);accent-color:#695378}.caption{font-size:13px;color:#655e6d}.dark .stage{background:#302c38}.phase{display:block;margin-top:10px;min-height:24px;color:#655e6d}</style>
<h1>Cirruskit · attack animation</h1><p class="summary">Airborne pounce · reaching front paws · soft landing</p>
<div class="views"><section class="view"><h2>Game size · 130 × 130</h2><div class="stage game-stage"><div class="sprite game" role="img" aria-label="Cirruskit attacking at game size"></div></div></section><section class="view"><h2>Full size · 512 × 512</h2><div class="stage"><div class="sprite full" role="img" aria-label="Cirruskit attack animation"></div></div></section></div>
<div class="controls"><button id="toggle" type="button">Pause</button><button id="replay" type="button">Replay attack</button><button id="previous" type="button">Previous frame</button><button id="next" type="button">Next frame</button><select id="speed" aria-label="Playback speed"><option value="1">Normal speed</option><option value="0.5">Half speed</option><option value="0.25">Quarter speed</option></select><button id="background" type="button">Dark background</button></div>
<label for="scrub" id="frameLabel">Frame 1 of 25</label><div><input id="scrub" type="range" min="0" max="24" value="0" aria-label="Animation frame"></div><span class="phase" id="phase"></span><p class="caption">25 frames · 0.4 seconds · 5 × 5 sheet · repeats here with a short pause</p>
<script>
const durations=[16,16,16,16,16,16,16,16,16,16,16,16,16,16,16,16,16,16,16,16,16,16,16,16,16],phases=["Crouch","Crouch","Crouch","Crouch","Crouch","Crouch","Takeoff","Takeoff","Takeoff","Airborne reach","Airborne reach","Airborne reach","Airborne reach","Airborne reach","Airborne reach","Front-paws-first landing","Front-paws-first landing","Front-paws-first landing","Front-paws-first landing","Return to idle","Return to idle","Return to idle","Return to idle","Return to idle","Return to idle"],total=400,pauseBetween=800,starts=[];let sum=0;for(const d of durations){starts.push(sum);sum+=d;}
const sprites=document.querySelectorAll('.sprite'),toggle=document.getElementById('toggle'),scrub=document.getElementById('scrub'),label=document.getElementById('frameLabel'),speed=document.getElementById('speed');let paused=false,elapsed=0,last=performance.now(),frame=-1;
function paint(n,rest=false){frame=n;const x=n%5/4*100,y=Math.floor(n/5)/4*100;for(const s of sprites)s.style.backgroundPosition=x+'% '+y+'%';label.textContent='Frame '+(n+1)+' of '+durations.length;scrub.value=n;document.getElementById('phase').textContent=rest?'Ready':phases[n];}
function seek(n){paused=true;toggle.textContent='Play';n=(n+durations.length)%durations.length;elapsed=starts[n];paint(n);}
toggle.onclick=()=>{paused=!paused;toggle.textContent=paused?'Play':'Pause';};document.getElementById('replay').onclick=()=>{elapsed=0;paused=false;toggle.textContent='Pause';paint(0);};document.getElementById('previous').onclick=()=>seek(frame-1);document.getElementById('next').onclick=()=>seek(frame+1);scrub.oninput=()=>seek(Number(scrub.value));document.getElementById('background').onclick=event=>{document.body.classList.toggle('dark');event.target.textContent=document.body.classList.contains('dark')?'Checkerboard background':'Dark background';};
function tick(now){if(!paused){elapsed=(elapsed+(now-last)*Number(speed.value))%(total+pauseBetween);if(elapsed>=total){if(frame!==24||document.getElementById('phase').textContent!=='Ready')paint(24,true);}else{let n=24;while(n>0&&elapsed<starts[n])n--;if(n!==frame)paint(n);}}last=now;requestAnimationFrame(tick);}paint(0);requestAnimationFrame(tick);
</script></html>
